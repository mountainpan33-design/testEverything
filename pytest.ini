[pytest]
# 默认跑「冒烟 + 门禁纯函数 + 接口层」；黄金链路依赖真机与采集产物，用 -m golden 显式触发。
# 例：pytest                   # 默认（smoke + gate + api）
#     pytest -m smoke          # 冒烟（需真机）
#     pytest -m gate           # 门禁纯函数单测（无设备）
#     pytest -m api            # 接口层（只需网络，无真机）
#     pytest -m golden         # 黄金链路（需真机 + 产物）
markers =
    smoke: 冒烟用例，本地/云真机皆可跑
    golden: 黄金链路，依赖真机 + 采集产物校验
    gate: 门禁纯函数单测，不依赖任何设备
    api: 接口层用例，只依赖网络（不需要真机）
    vision: 视觉驱动层（Midscene.js），需真机 + 模型 API Key + Node，按次计费
    artifact: 产物层校验（拉服务器上的资源包验证结构与内容），只需测试账号

addopts = -v --strict-markers -m "smoke or gate or api"

testpaths = tests
