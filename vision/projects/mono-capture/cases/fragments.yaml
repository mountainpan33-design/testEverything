# 可复用步骤片段。用例里用 `- include: <名字>` 引用。
#
# 为什么单独放：登录这种流程每条用例都要走一遍，写 8 份就没法维护了。
# 片段也是数据，自动修正可以改它。

# 拉起 App 并清掉冷启动弹窗。
# 「发现新版本」这个弹窗每次冷启动都可能出现，盖住登录页会让后面所有点击落空。
# dismiss 先读控件树判断（免费），真出现了才叫一次模型去点。
bootstrap:
  - launch: true
  - dismiss: [暂不更新, 稍后再说, 跳过]

# 在登录页填账号密码并点登录（不管结果，结果由用例自己的 wait/assert 判）
login:
  - input: { target: '「用户名」输入框', value: '{{username}}' }
  - input: { target: '「密码」输入框', value: '{{password}}' }
  - tap: '「登录」按钮'

# 把还没做完的 onboarding 走完（协议 → 权限 → 首页）。
# 给「需要进到 App 内部」的用例兜底：它们不关心 onboarding，但不能卡在这儿。
finish-onboarding:
  - if:
      when: 当前界面是协议同意页，有多条协议勾选框和「同意并继续」按钮
      then:
        - check-all: { rounds: 3 }
        - wait:
            for: 「同意并继续」按钮已经变成可点击的深色状态
            timeout: 12000
        - tap: 「同意并继续」按钮
  - if:
      when: 当前界面是权限页，底部按钮写着「开启权限」
      then:
        - tap: 底部写着「开启权限」的按钮
  - if:
      when: 当前界面是权限页，底部按钮写着「进入首页」
      then:
        - tap: 底部写着「进入首页」的按钮

# 从「已登录」退回登录页（我的 → 退出登录 → 确认）
logout:
  - tap: '底部导航栏里的「我的」tab'
  - tap: '页面底部的「退出登录」按钮'
  - tap: '弹窗里确认退出的「退出」按钮'
  - wait: { for: '当前界面是登录页，能看到「用户名」「密码」输入框', timeout: 15000 }

# 确保停在首页（还没登录就先登录，onboarding 没走完就走完）。
# 给「需要进到 App 内部」的用例用，省得每条都要把前两步抄一遍。
go-home:
  - if:
      when: 当前界面是登录页，能看到「用户名」「密码」输入框
      then:
        - include: login
        - wait: { for: 已经离开登录页，能看到协议同意页、权限页或首页, timeout: 30000 }
  - include: finish-onboarding
  - wait: { for: 当前界面是首页：底部只有「首页」「我的」两个 tab, timeout: 20000 }

# 从任意页面回到「我的」页
go-me:
  - include: go-home
  - tap: 底部导航栏里的「我的」tab
  - wait: { for: 当前界面是「我的」页，能看到「本地交付包」「关于与更新」「语言」等条目, timeout: 15000 }

# 在 QC 页回答必答项并提交。
# 题目来自后端 taxonomy（L1/L2/L3 + 光照 + 工具），这里按「有这题就选第一个选项」处理，
# 少答一题按钮就点不动，所以每条都要覆盖到。
qc-answer-and-submit:
  - if:
      when: 页面上有「大场景类别（L1）」这一题和若干选项按钮
      then:
        - tap: 「大场景类别（L1）」这一题下面的第一个选项
  - input: { target: 「具体场所（L2）」输入框, value: 测试场所 }
  - input: { target: 「具体操作（L3）」输入框, value: 测试操作 }
  - if:
      when: 页面上有「本段视频的主要光照环境」这一题和若干选项
      then:
        - tap: 「本段视频的主要光照环境」这一题下面的第一个选项
  - if:
      when: 页面上有「本段用到了哪些工具或设备」这一题和若干选项
      then:
        - tap: 「本段用到了哪些工具或设备」这一题下面的第一个选项
  - if:
      when: 页面底部按钮写着「仍然上传」
      then:
        - tap: 底部写着「仍然上传」的按钮
      else:
        - tap: 底部写着「加入上传队列」的按钮
