# 由 `npx tsx src/cli.ts --derive` 从源码生成，请勿手改。
# 要改：把需要的用例挪进 cases.yaml，这里的重复项会被自动跳过；
# 或者直接删掉本文件重新生成。
#
# 这些用例只验「页面能打开、不白屏、关键文案还在」，不验业务对错。
# 执行靠深链 + 控件树，不调模型，几秒钟一页。

- id: RT-ABOUT
  title: 'about（/about）能正常打开'
  precondition: logged-in
  order: normal
  review:
    status: draft
    source: code
    note: '依据 src/app/about.tsx 生成；只验页面能打开、文案还在，不验业务'
  steps:
    - launch: true
    - check-route:
        route: 'about'
        expect-any:
          - '当前运行'
          - '原生版本'
          - 'JS 版本'
          - '随安装包内置'

